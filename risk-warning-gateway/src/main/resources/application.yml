spring:
  cloud:
    gateway:
      routes:
        # 用户认证服务
        - id: org-service
          uri: lb://risk-warning-org
          predicates:
            - Path=/api/org/**
          filters:
            - StripPrefix=2
        # 行为处理服务
        - id: processing-service
          uri: lb://risk-warning-processing
          predicates:
            - Path=/api/processing/**
          filters:
            - StripPrefix=2
        # 知识库服务
        - id: knowledge-service
          uri: lb://risk-warning-knowledge
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=2
        # 报告服务
        - id: report-service
          uri: lb://risk-warning-report
          predicates:
            - Path=/api/report/**
          filters:
            - StripPrefix=2
        # WebSocket 使用独立的 Netty 端口，必须先于通用 HTTP 路由匹配。
        - id: notification-service-ws
          uri: ${NOTIFICATION_WEBSOCKET_URI:ws://localhost:9090}
          predicates:
            - Path=/api/notification/ws
          filters:
            - StripPrefix=2
        # 通知服务
        - id: notification-service
          uri: lb://risk-warning-notification
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true


server:
  port: 8088
